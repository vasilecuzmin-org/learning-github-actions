sonar.projectKey=VasileCuzmin_learning-github-actions
sonar.organization=vasilecuzmin


# This is the name and version displayed in the SonarCloud UI.
sonar.projectName=learning-github-actions
sonar.projectVersion=1.0

#Coverage report paths
sonar.coverage.jacoco.xmlReportPaths=reports/coverage-report.xml

#Unit test report paths
sonar.junit.reportPaths=reports/test-report.xml

# Path is relative to the sonar-project.properties file. Replace "\" by "/" on Windows.
sonar.sources=.

# Exclude test files and __init__.py files from analysis
sonar.exclusions=**/tests/**, **/test_*.py, **/__init__.py

# Encoding of the source code. Default is default system encoding
sonar.sourceEncoding=UTF-8