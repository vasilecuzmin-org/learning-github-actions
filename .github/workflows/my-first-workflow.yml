name: my-first-workflow
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions: #Required for code scanning and secret scanning to work
  actions: read
  security-events: write
  packages: write
  contents: read

jobs:
  ci-pipeline-job:
    uses: vasilecuzmin-org/reusable-workflows/.github/workflows/ci-pipeline.yaml@main
    with:
      run_sonarqube: false
      run_codeql: false
      run_publish_ghcr: false
    secrets:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

  demo-1:
    name: Demo job 1
    runs-on: [self-hosted, arc-demo]
    steps:
      - name: Display system information
        run: |
          echo "Operating System: $(uname -s)"
          echo "Kernel Version: $(uname -r)"
          echo "Runner name: $RUNNER_NAME"
          echo "Runner OS: $RUNNER_OS"
  demo-2:
    name: Demo job 2
    runs-on: [self-hosted, arc-demo, X64] #pick a label that matches your self-hosted runner with labels "arc-demo" and "X64"
    steps:
      - name: Display system information
        run: |
          echo "Operating System: $(uname -s)"
          echo "Kernel Version: $(uname -r)"
          echo "Runner name: $RUNNER_NAME"
          echo "Runner OS: $RUNNER_OS"
  deploy-with-kubectl:
    needs: [ci-pipeline-job]
    runs-on: [self-hosted, arc-demo, X64]
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
      - name: Set up kubectl
        uses: azure/setup-kubectl@v3
      - name: Configure KubeConfig
        run: |
          mkdir -p ~/.kube
          echo "${{ secrets.KUBECONFIG }}" > ~/.kube/config
          kubectl version
          kubectl get nodes
